server.port=8080
server.error.include-message=always

# H2 in-memory database (data resets on restart). For MySQL see README.
spring.datasource.url=jdbc:h2:mem:blooddb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# JWT: change the secret before deploying (32+ characters)
app.jwt.secret=change-this-secret-to-a-long-random-string-before-deploying
app.jwt.expiration-ms=86400000
app.cors.origin=http://localhost:5173
